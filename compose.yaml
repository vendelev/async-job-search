services:
  app:
    build:
      context: ./docker/php
    restart: always
    working_dir: /var/www
    init: true
    stop_grace_period: 30s
    volumes:
      - ./backend:/var/www
    env_file:
      - path: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["php", "bin/vacancy-discovery-daemon.php"]
  postgres:
    image: ghcr.io/pgmq/pg18-pgmq:v1.10.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-async_job_search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_USER: ${POSTGRES_USER:-async_job_search}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
